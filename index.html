<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17142c">
<title>Sankalpa</title>
<style>html,body{margin:0;background:#17142c;color:#f6eedf;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#l{min-height:100vh;display:grid;place-items:center;text-align:center;padding:16px}</style>
</head>
<body>
<div id="l">Opening Sankalpa…</div>
<script>
/* Sankalpa runs here and keeps its data in the organizer's Google Sheet through this connector. */
var API = "https://script.google.com/macros/s/AKfycbzsNAwUvRQnlLjAY-AIJt97hYqxA2Pn5g9DLG3iyE_AIVmLOu0iX5Eq4xyXFdADrVKizw/exec";
function runner(ok, fail) {
  return new Proxy({}, { get: function (_, name) {
    if (name === "withSuccessHandler") return function (f) { return runner(f, fail); };
    if (name === "withFailureHandler") return function (f) { return runner(ok, f); };
    return function () {
      var args = Array.prototype.slice.call(arguments);
      fetch(API, { method: "POST", credentials: "omit", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn: name, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && j.ok) { if (ok) ok(j.result); } else if (fail) fail(new Error((j && j.error) || "Server error")); })
        .catch(function (e) { if (fail) fail(e); });
    };
  } });
}
window.google = { script: {
  get run() { return runner(); },
  url: { getLocation: function (cb) { var p = {}; new URLSearchParams(location.search).forEach(function (v, k) { p[k] = v; }); cb({ parameter: p }); } }
} };
function load(n) {
  fetch(API + "?raw=1", { credentials: "omit", redirect: "follow" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (h) { document.open(); document.write(h); document.close(); })
    .catch(function () { if (n < 2) return setTimeout(function () { load(n + 1); }, 1500); document.getElementById("l").textContent = "Couldn't open Sankalpa. Check your internet connection and reload the page."; });
}
load(0);
</script>
</body>
</html>
